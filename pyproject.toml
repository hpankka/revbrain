[project]
name = "revbrain"
version = "0.1.0"
description = "REVBRAIN PyTorch implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.1",
    "numpy==2.2.4",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "torch==2.10.0",
    "joblib"
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
