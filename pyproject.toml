[project]
name = "revbrain"
version = "0.1.0"
description = "REVBRAIN PyTorch implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.1",
    "numpy==2.2.4",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "joblib"
]

[project.optional-dependencies]
cpu = ["torch==2.10.0"]
cu128 = ["torch==2.10.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
